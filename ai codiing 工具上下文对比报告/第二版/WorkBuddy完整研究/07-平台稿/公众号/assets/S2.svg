<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="一次请求的五块料与来源标注">
<style>
text{font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.bg{fill:#f4f6fb}
.card{fill:#ffffff;stroke:#dfe5ef;stroke-width:1.5}
.tag{font-size:13.5px;fill:#5b6779;letter-spacing:.08em}
.h1{font-size:30px;font-weight:700;fill:#1b2330}
.sub{font-size:15.5px;fill:#5b6779}
.bt{font-size:17px;font-weight:700;fill:#1b2330}
.bb{font-size:14.5px;fill:#1b2330}
.mini{font-size:13px;fill:#5b6779}
.badge{font-size:14px;font-weight:700}
</style>
<rect class="bg" x="0" y="0" width="1200" height="700"/>
<text class="tag" x="40" y="42">上下文管理 · S2</text>
<text class="h1" x="40" y="82">一次请求的五块料（逐块标来源）</text>
<text class="sub" x="40" y="114">请求是「拼」出来的，不是「聊」出来的 —— 每一拍都按当前状态重新组装</text>

<!-- legend -->
<rect x="40" y="136" width="16" height="16" rx="4" fill="#2952cc"/>
<text class="mini" x="64" y="150">程序给的</text>
<rect x="164" y="136" width="16" height="16" rx="4" fill="#0d9488"/>
<text class="mini" x="188" y="150">一半程序、一半你</text>
<rect x="372" y="136" width="16" height="16" rx="4" fill="#c2410c"/>
<text class="mini" x="396" y="150">你给的</text>

<!-- block 1 -->
<rect class="card" x="40" y="172" width="1120" height="78" rx="12"/>
<rect x="40" y="172" width="6" height="78" rx="3" fill="#2952cc"/>
<text class="bt" x="68" y="204">① 基础指令　<tspan class="mini" font-weight="400">base instructions</tspan></text>
<text class="bb" x="68" y="230">「你是怎样的助手」——固定岗位说明书，你通常看不到也不该改</text>
<rect x="968" y="196" width="164" height="32" rx="16" fill="#e7edfb"/>
<text class="badge" x="1050" y="217" text-anchor="middle" fill="#1e3f9e">程序</text>

<!-- block 2 -->
<rect class="card" x="40" y="264" width="1120" height="94" rx="12"/>
<rect x="40" y="264" width="6" height="94" rx="3" fill="#2952cc"/>
<text class="bt" x="68" y="296">② developer 材料　<tspan class="mini" font-weight="400">程序维护的工作说明</tspan></text>
<text class="bb" x="68" y="322">· 当前工作状态（WorldState 渲染）：工作目录 / 权限 / 网络</text>
<text class="bb" x="68" y="346">· 已加载的项目规则（AGENTS.md 等）：如「本项目时间必须用 UTC」</text>
<rect x="968" y="296" width="164" height="32" rx="16" fill="#e7edfb"/>
<text class="badge" x="1050" y="317" text-anchor="middle" fill="#1e3f9e">程序</text>

<!-- block 3 -->
<rect class="card" x="40" y="372" width="1120" height="78" rx="12"/>
<rect x="40" y="372" width="6" height="78" rx="3" fill="#0d9488"/>
<text class="bt" x="68" y="404">③ 对话历史　<tspan class="mini" font-weight="400">消息、工具调用与结果</tspan></text>
<text class="bb" x="68" y="430">之前所有来往：你发的话 + 模型回复 + 工具结果，由程序按时间序维护</text>
<rect x="952" y="396" width="180" height="32" rx="16" fill="#e2f5f2"/>
<text class="badge" x="1042" y="417" text-anchor="middle" fill="#0d9488">一半程序、一半你</text>

<!-- block 4 -->
<rect class="card" x="40" y="464" width="1120" height="78" rx="12"/>
<rect x="40" y="464" width="6" height="78" rx="3" fill="#2952cc"/>
<text class="bt" x="68" y="496">④ 工具说明　<tspan class="mini" font-weight="400">tools schema</tspan></text>
<text class="bb" x="68" y="522">有哪些工具、怎么调用——工具清单本身也占空间，与聊天无关却每次都带</text>
<rect x="968" y="488" width="164" height="32" rx="16" fill="#e7edfb"/>
<text class="badge" x="1050" y="509" text-anchor="middle" fill="#1e3f9e">程序</text>

<!-- block 5 -->
<rect class="card" x="40" y="556" width="1120" height="78" rx="12"/>
<rect x="40" y="556" width="6" height="78" rx="3" fill="#c2410c"/>
<text class="bt" x="68" y="588">⑤ 本次用户输入</text>
<text class="bb" x="68" y="614">你刚敲下的那行字——唯一 100% 由你决定的一块</text>
<rect x="968" y="580" width="164" height="32" rx="16" fill="#fdeede"/>
<text class="badge" x="1050" y="601" text-anchor="middle" fill="#c2410c">你</text>

<text class="mini" x="40" y="668">关键：<tspan font-weight="700" fill="#1b2330">你只控制了五块里的最后一块</tspan>——其余四块由程序按当前状态替你准备好，所以「我只说了一句话，请求却那么长」。</text>
<text class="mini" x="40" y="690" fill="#5b6779">出处：T15 M02 §一「一次请求的组成清单（五块料）」；稳定材料排前、易变内容排后（前缀缓存偏好，见 M07）。</text>
</svg>
