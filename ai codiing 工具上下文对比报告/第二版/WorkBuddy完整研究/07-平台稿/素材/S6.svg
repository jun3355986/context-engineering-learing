<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="保留骨架与两层事实">
<style>
text{font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.bg{fill:#f4f6fb}
.card{fill:#ffffff;stroke:#dfe5ef;stroke-width:1.5}
.tag{font-size:13.5px;fill:#5b6779;letter-spacing:.08em}
.h1{font-size:30px;font-weight:700;fill:#1b2330}
.sub{font-size:15.5px;fill:#5b6779}
.st{font-size:17px;font-weight:700;fill:#1b2330}
.bb{font-size:14.5px;fill:#1b2330}
.mini{font-size:13px;fill:#5b6779}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect class="bg" x="0" y="0" width="1200" height="800"/>
<text class="tag" x="40" y="42">上下文管理 · S6</text>
<text class="h1" x="40" y="82">保留骨架 + 两层事实</text>
<text class="sub" x="40" y="114">整理 ≠ 换一页摘要 —— 大部分近期原话被原样留下，产物至少两种形态</text>

<!-- 五步骨架 -->
<rect class="card" x="40" y="140" width="520" height="330" rx="12"/>
<text class="st" x="64" y="174">保留骨架（五步）</text>
<g>
<rect x="64" y="190" width="472" height="46" rx="9" fill="#eef2f9"/>
<text class="bb" x="82" y="219">① 筛候选<tspan class="mini">　谁有资格「原样留下」——类型过滤，不按语义评重要性</tspan></text>
<rect x="64" y="244" width="472" height="46" rx="9" fill="#eef2f9"/>
<text class="bb" x="82" y="273">② 用预算<tspan class="mini">　从新到旧把候选装进共享预算</tspan></text>
<rect x="64" y="298" width="472" height="46" rx="9" fill="#eef2f9"/>
<text class="bb" x="82" y="327">③ 边界处理<tspan class="mini">　装不下的边界条目截短（保头尾），然后停手</tspan></text>
<rect x="64" y="352" width="472" height="46" rx="9" fill="#eef2f9"/>
<text class="bb" x="82" y="381">④ 产物另加<tspan class="mini">　摘要 / 压缩条目单独追加，不占「原样保留」预算</tspan></text>
<rect x="64" y="406" width="472" height="46" rx="9" fill="#eef2f9"/>
<text class="bb" x="82" y="435">⑤ 重组规则<tspan class="mini">　重新渲染当前工作状态与规则，摆回靠前</tspan></text>
</g>

<!-- 装箱演算 -->
<rect class="card" x="590" y="140" width="570" height="330" rx="12"/>
<text class="st" x="614" y="174">装箱演算（本地摘要路径）</text>
<text class="mini" x="614" y="198">共享预算 <tspan font-weight="700" fill="#1b2330">20,000</tspan>【源码常量】　远端 v2 = <tspan font-weight="700" fill="#1b2330">64,000</tspan>【源码常量】</text>

<text class="mini" x="614" y="228" fill="#5b6779">整理前（旧历史）</text>
<rect x="614" y="238" width="522" height="86" rx="9" fill="#fdeaea" stroke="#b91c1c" stroke-width="1"/>
<text class="mini" x="630" y="260">[旧摘要（被前缀识别，排除）]</text>
<text class="mini" x="630" y="282">M1 = 12,000　M2 = 10,000　M3 = 6,000<tspan fill="#5b6779">　【演示】</tspan></text>
<text class="mini" x="630" y="304">工具结果 / 图片 / …</text>

<path d="M 875 330 L 875 344" stroke="#2952cc" stroke-width="2.2" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2952cc"/></marker></defs>
<text class="mini" x="888" y="342" fill="#2952cc">倒着装：M3(6,000)→剩14,000；M2(10,000)→剩4,000；M1(12,000&gt;4,000)→边界截短≈4,000；停手</text>

<text class="mini" x="614" y="372" fill="#5b6779">整理后（替代历史 replacement_history）</text>
<rect x="614" y="382" width="522" height="74" rx="9" fill="#e6f6ea" stroke="#15803d" stroke-width="1"/>
<text class="mini" x="630" y="404">① 重组后的规则与环境（靠前）　② [M1 截短片段]（头尾 ≈4,000）</text>
<text class="mini" x="630" y="426">③ [M2] 原样　④ [M3] 原样　⑤ [新摘要] 另加（不占原话预算）</text>
<text class="mini" x="630" y="448" fill="#5b6779">按规则在边界消息后停止 —— 不回头挑更早的小条目补缝</text>

<!-- 两层事实 -->
<rect x="40" y="490" width="1120" height="200" rx="12" fill="#ffffff" stroke="#2952cc" stroke-width="1.5"/>
<text class="st" x="64" y="524" fill="#1e3f9e">两层事实（统一裁决 C-03 / C-12）</text>

<rect x="64" y="540" width="528" height="126" rx="10" fill="#fdeaea"/>
<text class="bb" x="84" y="570" font-weight="700" fill="#b91c1c">模型可见层（这次请求带上的那份）</text>
<text class="mini" x="84" y="598">已被替代历史（摘要 + 保留项）替换，原文不在</text>
<text class="mini" x="84" y="622" font-weight="700" fill="#b91c1c">不可自动恢复</text>
<text class="mini" x="84" y="648" fill="#5b6779">不是「程序删了」，是「它不在这一份里」</text>

<rect x="608" y="540" width="528" height="126" rx="10" fill="#e6f6ea"/>
<text class="bb" x="628" y="570" font-weight="700" fill="#15803d">磁盘原文层（会话存档 / 落盘文件）</text>
<text class="mini" x="628" y="598">九工具均有落盘 / 存档入口，原文保留期内可查</text>
<text class="mini" x="628" y="622" font-weight="700" fill="#15803d">可查回（人工 / 工具从磁盘读）</text>
<text class="mini" x="628" y="648" fill="#5b6779">保留期是「可查窗口」，不是「永久档案」（如 claude ≈30 天、ocv1/ocv2 ≈7 天）</text>

<text class="mini" x="40" y="724">当心：❌「被压缩内容绝不可能找回」——只在<tspan font-weight="700">模型可见层</tspan>成立；❌「摘要就是权威指令」——摘要是一份模型写的二手材料（属「资料」，不是「指令」）。</text>
<text class="mini" x="40" y="750" fill="#5b6779">出处：T15 M04 §四（两层事实）、§二（骨架）；数字 20,000 / 64,000 为【源码常量】，12,000 / 10,000 / 6,000 为【演示】。</text>
<text class="mini" x="40" y="774" fill="#5b6779">「重要」不参与筛选——算法只看类型、预算、顺序。</text>
</svg>
